<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Where the code lives: each hot path is sized to a level of the CPU memory hierarchy.">
<style>
  .bg{fill:#0d1117;stroke:#30363d}
  .panel{fill:#161b22;stroke:#30363d;stroke-width:1}
  .h1{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .h2{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .sub{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e}
  .cap{font:600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e;letter-spacing:.08em}
  .mono{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#e6edf3}
  .name{font:700 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0883e}
  .desc{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
  .big{font:700 20px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0883e}
  .out{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#3fb950}
  .note{font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e}
  .tag{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0883e}
  .small{font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .unit{fill:#161b22;stroke:#30363d;stroke-width:1}
  .ulabel{font:600 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
  .die{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
  .ann{opacity:.45}
  @keyframes hl{0%,16%{fill:rgba(240,136,62,0.16);stroke:#f0883e;stroke-width:2}19%,100%{}}
  @keyframes on{0%,16%{opacity:1}19%,100%{opacity:.45}}
  .hl-simd{animation:hl 12.0s 0.0s infinite}
  .ann-simd{animation:on 12.0s 0.0s infinite}
  .hl-l1{animation:hl 12.0s 2.4s infinite}
  .ann-l1{animation:on 12.0s 2.4s infinite}
  .hl-l2{animation:hl 12.0s 4.8s infinite}
  .ann-l2{animation:on 12.0s 4.8s infinite}
  .hl-llc{animation:hl 12.0s 7.199999999999999s infinite}
  .ann-llc{animation:on 12.0s 7.199999999999999s infinite}
  .hl-core{animation:hl 12.0s 9.6s infinite}
  .ann-core{animation:on 12.0s 9.6s infinite}
</style>
<rect class="bg" x=".5" y=".5" width="999" height="469" rx="14"/>
<text x="28" y="48" class="h2" text-anchor="start">where the code lives</text>
<text x="28" y="74" class="sub" text-anchor="start">Hot paths are sized to a level of the memory hierarchy — detected at runtime, with portable fallbacks.</text>
<rect class="die" x="24" y="96" width="528" height="316" rx="12"/>
<text x="38" y="116" class="cap" text-anchor="start">CPU</text>
<rect class="unit hl-core" x="40" y="126" width="244" height="106" rx="9"/>
<text x="52" y="144" class="ulabel" text-anchor="start">core 0</text>
<rect class="unit hl-simd" x="52" y="154" width="104" height="30" rx="6"/>
<text x="104" y="174" class="ulabel" text-anchor="middle">SIMD</text>
<rect class="unit hl-l1" x="164" y="154" width="108" height="30" rx="6"/>
<text x="218" y="174" class="ulabel" text-anchor="middle">L1d</text>
<rect class="unit hl-l2" x="52" y="192" width="220" height="30" rx="6"/>
<text x="162" y="212" class="ulabel" text-anchor="middle">L2</text>
<text x="66" y="174" class="tag" text-anchor="middle">①</text>
<text x="178" y="174" class="tag" text-anchor="middle">②</text>
<text x="66" y="212" class="tag" text-anchor="middle">③</text>
<rect class="unit hl-core" x="292" y="126" width="244" height="106" rx="9"/>
<text x="304" y="144" class="ulabel" text-anchor="start">core 1</text>
<rect class="unit hl-simd" x="304" y="154" width="104" height="30" rx="6"/>
<text x="356" y="174" class="ulabel" text-anchor="middle">SIMD</text>
<rect class="unit hl-l1" x="416" y="154" width="108" height="30" rx="6"/>
<text x="470" y="174" class="ulabel" text-anchor="middle">L1d</text>
<rect class="unit hl-l2" x="304" y="192" width="220" height="30" rx="6"/>
<text x="414" y="212" class="ulabel" text-anchor="middle">L2</text>
<rect class="unit hl-core" x="40" y="242" width="244" height="106" rx="9"/>
<text x="52" y="260" class="ulabel" text-anchor="start">core 2</text>
<rect class="unit hl-simd" x="52" y="270" width="104" height="30" rx="6"/>
<text x="104" y="290" class="ulabel" text-anchor="middle">SIMD</text>
<rect class="unit hl-l1" x="164" y="270" width="108" height="30" rx="6"/>
<text x="218" y="290" class="ulabel" text-anchor="middle">L1d</text>
<rect class="unit hl-l2" x="52" y="308" width="220" height="30" rx="6"/>
<text x="162" y="328" class="ulabel" text-anchor="middle">L2</text>
<rect class="unit hl-core" x="292" y="242" width="244" height="106" rx="9"/>
<text x="304" y="260" class="ulabel" text-anchor="start">core 3</text>
<rect class="unit hl-simd" x="304" y="270" width="104" height="30" rx="6"/>
<text x="356" y="290" class="ulabel" text-anchor="middle">SIMD</text>
<rect class="unit hl-l1" x="416" y="270" width="108" height="30" rx="6"/>
<text x="470" y="290" class="ulabel" text-anchor="middle">L1d</text>
<rect class="unit hl-l2" x="304" y="308" width="220" height="30" rx="6"/>
<text x="414" y="328" class="ulabel" text-anchor="middle">L2</text>
<rect class="unit hl-llc" x="40" y="362" width="496" height="38" rx="8"/>
<text x="288" y="386" class="ulabel" text-anchor="middle">L3 / LLC (shared)</text>
<text x="56" y="386" class="tag" text-anchor="middle">④</text>
<text x="526" y="116" class="tag" text-anchor="end">⑤ all cores</text>
<rect class="unit" x="24" y="422" width="528" height="30" rx="8"/>
<text x="288" y="442" class="ulabel" text-anchor="middle">DRAM</text>
<g class="ann ann-simd">
<text x="584" y="122" class="tag" text-anchor="start">① SIMD · yolow64</text>
<text x="584" y="142" class="note" text-anchor="start">AVX-512 / AVX2 / NEON, five tiers at runtime;</text>
<text x="584" y="160" class="note" text-anchor="start">101 GB/s Base64 decode with full validation</text>
</g>
<g class="ann ann-l1">
<text x="584" y="188" class="tag" text-anchor="start">② L1d · yolowhtml</text>
<text x="584" y="208" class="note" text-anchor="start">block content model: 125 depth-5 oblivious trees,</text>
<text x="584" y="226" class="note" text-anchor="start">≈ 11 KiB of weights that stay L1-resident</text>
</g>
<g class="ann ann-l2">
<text x="584" y="254" class="tag" text-anchor="start">③ L2 · yolowzstd</text>
<text x="584" y="274" class="note" text-anchor="start">match tables budgeted from the detected cache;</text>
<text x="584" y="292" class="note" text-anchor="start">generation-stamped, no per-call memset</text>
</g>
<g class="ann ann-llc">
<text x="584" y="320" class="tag" text-anchor="start">④ LLC · yolow64</text>
<text x="584" y="340" class="note" text-anchor="start">non-temporal stores past 3/7 of the LLC:</text>
<text x="584" y="358" class="note" text-anchor="start">16 MiB encode 7.36 → 13.0 GB/s</text>
</g>
<g class="ann ann-core">
<text x="584" y="386" class="tag" text-anchor="start">⑤ cores · pagesift-flow + yolowzstd</text>
<text x="584" y="406" class="note" text-anchor="start">cgroup-sized NUMA worker pool;</text>
<text x="584" y="424" class="note" text-anchor="start">zstd frames decoded in parallel, zero-copy</text>
</g>
<text x="976" y="456" class="small" text-anchor="end">numbers: each repo's own benchmark pages</text>
</svg>