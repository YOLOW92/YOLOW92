<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-label="yolow64: Regroup the bits; Turn a vector into a lookup; Validate while decoding; Choose the hardware path; Respect the cache"><title>yolow64 — BIT ALGEBRA × SIMD</title><desc>Base64 with full validation and hardware-specific kernels. Three octets become four independent six-bit indices. RFC 4648 · Man → TWFu · 24 = 4 × 6 AVX-512 VBMI extracts fields and permutes the alphabet. 512-bit registers · 64 lanes · encode kernel A full-domain lookup and validity checks reject invalid characters. VBMI decoder · strict padding / alphabet semantics Runtime dispatch selects a supported kernel, not a universal assumption. x86 tiers + AArch64 fallback · BMI2 detected independently Streaming stores reduce cache pollution for suitable cold buffers. Zen 5: 101.4 GB/s decode at 16 KiB · repository benchmark</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#58a6ff"/></marker></defs><style>.bg{fill:#0d1117;stroke:#30363d}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.name{font-size:26px;font-weight:700;letter-spacing:-.5px}.tag{font:600 12px ui-monospace,monospace;letter-spacing:1.8px;fill:#f0883e}.sub{font-size:15px;fill:#9da7b3}.heading{font-size:24px;font-weight:650;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:13px;fill:#9da7b3}.mono{font:14px ui-monospace,monospace}.accent{font:600 14px ui-monospace,monospace;fill:#f0883e}.large{font:600 23px ui-monospace,monospace}.scene{opacity:0}.scene0{opacity:1}@keyframes scene0{0%,18.9%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-5px)}98.9%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}.scene0{animation:scene0 35s linear infinite}@keyframes scene1{0%,20%{opacity:0;transform:translateY(5px)}21.1%,38.9%{opacity:1;transform:translateY(0)}40%,100%