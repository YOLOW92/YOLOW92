<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-label="yolowzstd: Entropy sets the target; Two symbols, one lookup; Choose table precision; Filter eight tags at once; Optimize parsing, not just matching"><title>yolowzstd — ENTROPY × CACHE</title><desc>Safe Rust Zstandard with adaptive entropy and match engines. Frequent symbols receive shorter prefix codes. H(X) = −Σ p log₂ p · Shannon (1948); Huffman (1952) · illustrative frequencies A 12-bit window can consume two prefix codes in one table access. Moffat &amp; Turpin (1997) · 4096 × 4 B = 16 KiB Quantize symbol frequencies under an exact integer slot budget. FSE · Σ qᵢ = 2ᴸ · KL-guided normalization / MDL · example SWAR equality masks remove candidates before full comparisons. Warren, Hacker’s Delight · safe u64 arithmetic · mask 00100101 The high-level encoder minimizes estimated bit cost over a chunk. Q3 fixed-point entropy · BT4 · 4096-position chunked DP</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#58a6ff"/></marker></defs><style>.bg{fill:#0d1117;stroke:#30363d}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.name{font-size:26px;font-weight:700;letter-spacing:-.5px}.tag{font:600 12px ui-monospace,monospace;letter-spacing:1.8px;fill:#f0883e}.sub{font-size:15px;fill:#9da7b3}.heading{font-size:24px;font-weight:650;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:13px;fill:#9da7b3}.mono{font:14px ui-monospace,monospace}.accent{font:600 14px ui-monospace,monospace;fill:#f0883e}.large{font:600 23px ui-monospace,monospace}.scene{opacity:0}.scene0{opacity:1}@keyframes scene0{0%,18.9%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-5px)}98.9%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}.scene0{animation:scene0 35s linear infinite}@keyframes scene1{0%,20%{opacity:0;transform:t