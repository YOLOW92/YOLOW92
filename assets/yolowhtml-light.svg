<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-label="yolowhtml: Represent a page as blocks; Five tests become one index; Choose the F1-optimal cut; Decode the coherent sequence; Keep the model cache-resident"><title>yolowhtml — STATISTICS × DOM</title><desc>HTML5 parsing and a learned fallback for main-content recovery. DOM features describe density, entropy and structural repetition. Fallback block model · WCXB development split An oblivious tree uses identical tests per depth; five bits address a leaf. CatBoost · Prokhorenkova et al. (2018) · 125 depth-5 trees Sort calibrated probabilities and maximize word-weighted expected F1. Lipton et al. (2014) · θ* = F1*/2 · example threshold 0.40 A nearby low-score block can survive a global sequence decision. Web2Text · Vogels et al. (2018) · penalty λ₀ + λ₁/(1 + dLCA) Compact weights and independent comparisons reduce pointer chasing. Safe Rust · 128-wide feature buffer · 32 leaves per tree</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#0969da"/></marker></defs><style>.bg{fill:#ffffff;stroke:#d0d7de}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}.name{font-size:26px;font-weight:700;letter-spacing:-.5px}.tag{font:600 12px ui-monospace,monospace;letter-spacing:1.8px;fill:#a74100}.sub{font-size:15px;fill:#57606a}.heading{font-size:24px;font-weight:650;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:13px;fill:#57606a}.mono{font:14px ui-monospace,monospace}.accent{font:600 14px ui-monospace,monospace;fill:#a74100}.large{font:600 23px ui-monospace,monospace}.scene{opacity:0}.scene0{opacity:1}@keyframes scene0{0%,18.9%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-5px)}98.9%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}.scene0{animation:scene0 35s linear infinite}@keyframes scene1{0