<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-label="yolow64: Regroup the bits; Turn a vector into a lookup; Validate while decoding; Choose the hardware path; Respect the cache"><title>yolow64 — BIT ALGEBRA × SIMD</title><desc>Base64 with full validation and hardware-specific kernels. Three octets become four independent six-bit indices. RFC 4648 · Man → TWFu · 24 = 4 × 6 AVX-512 VBMI extracts fields and permutes the alphabet. 512-bit registers · 64 lanes · encode kernel A full-domain lookup and validity checks reject invalid characters. VBMI decoder · strict padding / alphabet semantics Runtime dispatch selects a supported kernel, not a universal assumption. x86 tiers + AArch64 fallback · BMI2 detected independently Streaming stores reduce cache pollution for suitable cold buffers. Zen 5: 101.4 GB/s decode at 16 KiB · repository benchmark</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#0969da"/></marker></defs><style>.bg{fill:#ffffff;stroke:#d0d7de}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}.name{font-size:26px;font-weight:700;letter-spacing:-.5px}.tag{font:600 12px ui-monospace,monospace;letter-spacing:1.8px;fill:#a74100}.sub{font-size:15px;fill:#57606a}.heading{font-size:24px;font-weight:650;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:13px;fill:#57606a}.mono{font:14px ui-monospace,monospace}.accent{font:600 14px ui-monospace,monospace;fill:#a74100}.large{font:600 23px ui-monospace,monospace}.scene{opacity:0}.scene0{opacity:1}@keyframes scene0{0%,18.9%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-5px)}98.9%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}.scene0{animation:scene0 35s linear infinite}@keyframes scene1{0%,20%{opacity:0;transform:translateY(5px)}21.1%,38.9%{opacity:1;transform:translateY(0)}40%,100%{opacity:0;transform:translateY(-5px)}}.scene1{animation:scene1 35s linear infinite}@keyframes scene2{0%,40%{opacity:0;transform:translateY(5px)}41.1%,58.9%{opacity:1;transform:translateY(0)}60%,100%{opacity:0;transform:translateY(-5px)}}.scene2{animation:scene2 35s linear infinite}@keyframes scene3{0%,60%{opacity:0;transform:translateY(5px)}61.1%,78.9%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(-5px)}}.scene3{animation:scene3 35s linear infinite}@keyframes scene4{0%,80%{opacity:0;transform:translateY(5px)}81.1%,98.9%{opacity:1;transform:translateY(0)}100%,100%{opacity:0;transform:translateY(-5px)}}.scene4{animation:scene4 35s linear infinite}@keyframes stageStep{0%,1%{opacity:0;transform:translateY(6px)}5%,100%{opacity:1;transform:translateY(0)}}@keyframes stageMeter{0%,1%{transform:scaleX(0)}8%,100%{transform:scaleX(1)}}@keyframes stageTrace{0%,1%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}@keyframes signalMove{to{stroke-dashoffset:-18}}.meter{transform-box:fill-box;transform-origin:left center}.trace{stroke-dasharray:1}.signal{stroke-dasharray:5 4;animation:signalMove 2.4s linear infinite}.scene0 .step{animation:stageStep 35s 0s infinite both}.scene0 .step:nth-of-type(2n){animation-delay:0.45s}.scene0 .step:nth-of-type(3n){animation-delay:0.85s}.scene0 .meter{animation:stageMeter 35s 0s infinite both}.scene0 .trace{animation:stageTrace 35s 0s infinite both}.scene1 .step{animation:stageStep 35s 7s infinite both}.scene1 .step:nth-of-type(2n){animation-delay:7.45s}.scene1 .step:nth-of-type(3n){animation-delay:7.85s}.scene1 .meter{animation:stageMeter 35s 7s infinite both}.scene1 .trace{animation:stageTrace 35s 7s infinite both}.scene2 .step{animation:stageStep 35s 14s infinite both}.scene2 .step:nth-of-type(2n){animation-delay:14.45s}.scene2 .step:nth-of-type(3n){animation-delay:14.85s}.scene2 .meter{animation:stageMeter 35s 14s infinite both}.scene2 .trace{animation:stageTrace 35s 14s infinite both}.scene3 .step{animation:stageStep 35s 21s infinite both}.scene3 .step:nth-of-type(2n){animation-delay:21.45s}.scene3 .step:nth-of-type(3n){animation-delay:21.85s}.scene3 .meter{animation:stageMeter 35s 21s infinite both}.scene3 .trace{animation:stageTrace 35s 21s infinite both}.scene4 .step{animation:stageStep 35s 28s infinite both}.scene4 .step:nth-of-type(2n){animation-delay:28.45s}.scene4 .step:nth-of-type(3n){animation-delay:28.85s}.scene4 .meter{animation:stageMeter 35s 28s infinite both}.scene4 .trace{animation:stageTrace 35s 28s infinite both}@media(prefers-reduced-motion:reduce){.scene,.scene *{animation:none!important}.scene{opacity:0}.scene0{opacity:1}.trace{stroke-dashoffset:0}.signal{stroke-dasharray:none}}</style><rect class="bg" x=".5" y=".5" width="799" height="364" rx="14"/><text x="27" y="38" class="name" text-anchor="start">yolow64</text><text x="773" y="35" class="tag" text-anchor="end">BIT ALGEBRA × SIMD</text><path d="M26 54L774 54" stroke="#d0d7de" fill="none" stroke-width="1.6" /><g class="scene scene0"><text x="27" y="86" class="heading" text-anchor="start">Regroup the bits</text><text x="27" y="108" class="sub" text-anchor="start">Three octets become four independent six-bit indices.</text><text x="400" y="132" class="small" text-anchor="middle">M · 0x4D     a · 0x61     n · 0x6E   →   24 bits</text><rect x="54" y="142" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#a74100"/><text x="134" y="177" class="large" text-anchor="middle">010011</text><text x="134" y="219" class="mono" text-anchor="middle">19</text><path d="M134 228L134 245" stroke="#0969da" fill="none" stroke-width="1.6" class="signal" marker-end="url(#arrow)"/><g class="step"><rect x="103" y="250" width="62" height="44" rx="8" fill="#e6edf5" stroke="#a74100"/><text x="134" y="277" class="accent" text-anchor="middle">T</text></g><rect x="235" y="142" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#0969da"/><text x="315" y="177" class="large" text-anchor="middle">010110</text><text x="315" y="219