<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Yuanchao Wu: a pure-Rust stack from bytes to evidence. Inputs flow through yolowhtml, yolowpdf, yolowdoc and yolowsyntax into pagesift, which emits Markdown, JSON, DataGraph and MCP output.">
<style>
  .bg{fill:#ffffff;stroke:#d0d7de}
  .panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  .h1{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
  .h2{font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
  .sub{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .cap{font:600 10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e;letter-spacing:.08em}
  .mono{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
  .name{font:700 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#bc4c00}
  .desc{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}
  .big{font:700 20px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#bc4c00}
  .out{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1a7f37}
  .note{font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  .tag{font:700 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#bc4c00}
  .small{font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .flow{fill:none;stroke:#59636e;stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:3 7;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .cursor{fill:#bc4c00;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{fill:#bc4c00;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .hub{fill:rgba(188,76,0,0.10);stroke:#bc4c00;stroke-width:1.5}
  .dot{fill:#bc4c00}
</style>
