<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-label="yolowpdf: Map glyphs into page space; Recover reading order; Reconstruct two-dimensional math; Recognize sequences without alignment; Route models to available compute"><title>yolowpdf — GEOMETRY × LEARNING</title><desc>Native PDF extraction with an optional pure-Rust OCR engine. Text rendering matrices transform a glyph into physical coordinates. ISO 32000-2 §9.4.4 · Tᵣₘ = Tscale · Tₘ · CTM Recursive X-Y cuts separate spanning rows and local columns. Recursive XY-cut · Nagy et al. (1992) · geometric gutters Glyph rows, delimiters and column cuts recover matrix structure. Native LaTeX reconstruction · HMM text/math segmentation CTC collapses adjacent repeated labels, then removes blanks. Graves et al. (2006) · illustrative CTC path → AB Fast uses v2; Accurate uses det_v2 and completed v3 recognizers. v0.2.1 · unfinished v3 detection/layout/formula previews are not defaults</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#58a6ff"/></marker></defs><style>.bg{fill:#0d1117;stroke:#30363d}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e6edf3}.name{font-size:26px;font-weight:700;letter-spacing:-.5px}.tag{font:600 12px ui-monospace,monospace;letter-spacing:1.8px;fill:#f0883e}.sub{font-size:15px;fill:#9da7b3}.heading{font-size:24px;font-weight:650;letter-spacing:-.4px}.body{font-size:15px}.small{font-size:13px;fill:#9da7b3}.mono{font:14px ui-monospace,monospace}.accent{font:600 14px ui-monospace,monospace;fill:#f0883e}.large{font:600 23px ui-monospace,monospace}.scene{opacity:0}.scene0{opacity:1}@keyframes scene0{0%,18.9%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-5px)}98.9%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}.scene0{animation:scene0 35s linear infinite}@keyframes scene1{0%,20%{opac