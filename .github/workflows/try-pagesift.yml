name: try-pagesift

# A visitor opens an issue titled "[try] ..." with a URL; this job parses it with pagesift and replies.
# The issue body is untrusted: it is read from the event file inside the script, never spliced into a shell line.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: try-pagesift
  cancel-in-progress: false

jobs:
  parse:
    if: startsWith(github.event.issue.title, '[try]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pagesift
        run: python -m pip install --disable-pip-version-check --no-input pagesift
      - name: Parse and reply
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python -I scripts/try_pagesift.py
